<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ターゲット1900</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
}

body {
  font-family: Arial, sans-serif;
  background: #f2f4f7;
}

.app {
  width: 100%;
  min-height: 100vh;
  background: white;
  padding: 50px 25px;
  text-align: center;
}

/* =========================
   共通
========================= */

h1 {
  font-size: 32px;
  margin: 10px 0 40px;
}

p {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 10px;
}

input {
  width: 100%;
  padding: 18px;
  font-size: 22px;
  border: 2px solid #ccc;
  border-radius: 12px;
  margin-bottom: 20px;
  text-align: center;
}

button {
  width: 100%;
  padding: 20px;
  font-size: 22px;
  font-weight: bold;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  margin-bottom: 10px;
}

/* =========================
   問題画面
========================= */

#quizScreen {
  width: 100%;
  position: relative;
  min-height: 0;
}
#word {
  width: 100%;
  height: 42vh;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  cursor: pointer;
  user-select: none;
}

#word div {
  font-size: 20px;
  margin-bottom: 15px;
}

#word h2 {
  font-size: 48px;
  line-height: 1.2;
  margin: 0;
  max-width: 100%;
  overflow-wrap: anywhere;
}
#quizScreen button {
  z-index: 10;
}

/* =========================
   苦手ボタン
========================= */
#quizScreen #difficultButton {
  position: absolute;
  top: 15px;
  left: 15px;
  width: auto;
  padding: 5px 8px;
  margin: 0;
  font-size: 24px;
  background: transparent;
  z-index: 20;
}

/* =========================
   単語一覧
========================= */

#wordList div {
  display: flex;
  align-items: center;
  width: 100%;
  min-height: 65px;
  padding: 10px 0;
  border-bottom: 1px solid #ddd;
  font-size: 20px;
}

#wordList strong {
  width: 55px;
  flex-shrink: 0;
  text-align: center;
}

#wordList span:nth-of-type(2) {
  width: 170px;
  flex-shrink: 0;
  text-align: left;
  font-weight: bold;
  line-height: 1.3;
  overflow-wrap: anywhere;
}

#wordList span:nth-of-type(3) {
  flex: 1;
  min-width: 0;
  text-align: left;
  line-height: 1.4;
  overflow-wrap: anywhere;
  padding-left: 8px;
}

/* 間違えた単語一覧 */

#wordList div:has(span:nth-of-type(2)):not(:has(span:nth-of-type(3))) span:nth-of-type(1) {
  width: 170px;
  flex-shrink: 0;
  text-align: left;
  font-weight: bold;
  line-height: 1.3;
  overflow-wrap: anywhere;
}

#wordList div:has(span:nth-of-type(2)):not(:has(span:nth-of-type(3))) span:nth-of-type(2) {
  flex: 1;
  min-width: 0;
  text-align: left;
  line-height: 1.4;
  overflow-wrap: anywhere;
  padding-left: 8px;
}

#wordList hr {
  display: none;
}

#wrongButton {
  position: relative;
  top: 100px;
}
</style>
</head>

<body>

<div class="app">

  <h1>ターゲット1900</h1>

  <div id="startScreen">

    <p>開始番号</p>
    <input id="startNumber" type="number" value="1" min="1">

    <p>終了番号</p>
    <input id="endNumber" type="number" value="40" min="1">

    <button id="startButton">スタート</button>
  <button id="tenButton">範囲から10問</button>
  <button id="continueRangeButton">続きから10問</button>
    <button id="listButton">単語一覧</button>
  <button id="difficultListButton">苦手単語</button>
    <button id="wrongListButton">間違えた単語</button>

  </div>
<div id="quizScreen" style="display:none;">

  <div id="word"></div>
  <button id="difficultButton">☆</button>
<div id="progress"></div>
  <button id="wrongButton" style="display:none;">
    間違えた
  </button>

  <button id="continueTenButton" style="display:none;">
    残りの単語から10問
  </button>
<button id="quizBackButton" style="display:none;">
  戻る
</button>

</div>

  <div id="listScreen" style="display:none;">

    <h2>単語一覧</h2>
<button id="topBackButton">← 戻る</button>

    <div id="wordList"></div>
<button id="wrongQuizButton" style="display:none;">
  間違えた単語から10問
</button>

<button id="difficultQuizButton" style="display:none;">
  苦手単語から10問
</button>
    <button id="backButton">戻る</button>

  </div>

</div>

let remainingWords = [];

  JSON.parse(
    localStorage.getItem("difficultWords")

let answeredWrong = false;
let tenMode = false;

  document.getElementById("difficultButton");

  document.getElementById("progress");

  document.getElementById("listButton");

  document.getElementById("quizBackButton");
difficultButton.onclick = function() {

  const item =
    remainingWords[currentWord];

  if (!item) {
    return;
  }

  const exists =
    difficultWords.some(function(word) {
      return word[0] === item[0];
    });

  if (exists) {

    difficultWords =
      difficultWords.filter(function(word) {
        return word[0] !== item[0];
      });

    difficultButton.textContent = "☆";

  } else {

    difficultWords.push([
      item[0],
      item[1],
      item[2]
    ]);

    difficultButton.textContent = "⭐";
  }

  localStorage.setItem(
    "difficultWords",
    JSON.stringify(difficultWords)
  );
};
// =========================
// 前回の範囲を読み込む
// =========================

document.getElementById("startNumber").value =
  localStorage.getItem("startNumber") || 1;

document.getElementById("endNumber").value =
  localStorage.getItem("endNumber") || 40;
if (savedTenMode) {

  tenStart =
    Number(localStorage.getItem("tenStart"));

  tenEnd =
    Number(localStorage.getItem("tenEnd"));

  remainingRangeWords =
    JSON.parse(
      localStorage.getItem("remainingRangeWords")
    ) || [];

  if (remainingRangeWords.length > 0) {

    continueRangeButton.style.display =
      "block";

  }

}

// =========================
// 新しい範囲をスタート
// =========================

startButton.onclick = function() {

  const start = Number(
    document.getElementById("startNumber").value
  );

  const end = Number(
    document.getElementById("endNumber").value
  );


  if (
    start < 1 ||
    end > words.length ||
    start > end
  ) {

    alert(
      "1〜" + words.length +
      "の範囲で指定してください！"
    );

    return;
  }


  // 範囲を保存
  localStorage.setItem(
    "startNumber",
    start
  );

  localStorage.setItem(
    "endNumber",
    end
  );


  // 通常モード
  practicingWrongWords = false;
  answeredWrong = false;
  showingJapanese = false;
  tenMode = false;


  // 10問モードの残りをリセット
  remainingRangeWords = [];


  // 指定範囲を作る
  remainingWords =
    words
      .map(function(item, index) {

        return [
          item[0],
          item[1],
          index + 1
        ];

      })
      .slice(start - 1, end);


  continueTenButton.style.display =
    "none";


  startScreen.style.display = "none";
  listScreen.style.display = "none";
  quizScreen.style.display = "block";


  showNextWord();

};


// =========================
// 次の単語を表示
// =========================

function showNextWord() {

  // =========================
  // 今の問題が全部終わった
  // =========================

  if (remainingWords.length === 0) {

    word.innerHTML =
      "<h2>終了！</h2>";

    wrongButton.style.display =
      "none";
    quizBackButton.style.display = "block";


    // 10問モードで、
    // まだ範囲に単語が残っている
    if (
      tenMode &&
      remainingRangeWords.length > 0
    ) {

      continueTenButton.style.display =
        "block";
continueRangeButton.style.display =
  "block";

      return;
    }


    // 本当に全部終了
    continueTenButton.style.display =
      "none";
  quizBackButton.style.display =
  "none";


    word.onclick = function() {

      quizScreen.style.display =
        "none";

      listScreen.style.display =
        "block";

      wordList.innerHTML = "";


      wrongWords.forEach(function(item) {

        const div =
          document.createElement("div");

        div.innerHTML =
          "<strong>No. " +
          item[2] +
          "</strong><br>" +
          item[0] +
          "<br>" +
          item[1] +
          "<hr>";

        wordList.appendChild(div);

      });

    };


    return;
  }


  // =========================
  // ランダムに単語を選ぶ
  // =========================

  currentWord =
    Math.floor(
      Math.random() *
      remainingWords.length
    );


  const item =
    remainingWords[currentWord];
  const isDifficult =
  difficultWords.some(function(word) {
    return word[0] === item[0];
  });

difficultButton.textContent =
  isDifficult ? "⭐" : "☆";
if (tenMode) {

  const total =
    remainingRangeWords.length +
    remainingWords.length;

  const done =
    total - remainingRangeWords.length;

  progress.textContent =
    done + " / " + total;

} else {

  progress.textContent = "";

}

  word.innerHTML =
    "<div>No. " +
    item[2] +
    "</div>" +

    "<h2>" +
    item[0] +
    "</h2>";


  showingJapanese = false;
  answeredWrong = false;


  wrongButton.style.display =
    "none";

  wrongButton.textContent =
    "間違えた";


  continueTenButton.style.display =
    "none";


  word.onclick =
    normalWordClick;

}


// =========================
// 通常の単語クリック
// =========================

function normalWordClick() {

  if (remainingWords.length === 0) {
    return;
  }


  const item =
    remainingWords[currentWord];


  // 英語 → 日本語
  if (!showingJapanese) {

    word.innerHTML =
      "<div>No. " +
      item[2] +
      "</div>" +

      "<h2>" +
      item[1] +
      "</h2>";


    showingJapanese = true;


    wrongButton.style.display =
      "block";


    return;
  }


  // =========================
  // 日本語 → 次の単語
  // =========================


  // 間違えた単語の復習中
  if (
    practicingWrongWords &&
    !answeredWrong
  ) {

    const correctWord =
      remainingWords[currentWord];


    wrongWords =
      wrongWords.filter(function(item) {

        return item[0] !==
          correctWord[0];

      });


    localStorage.setItem(
      "wrongWords",
      JSON.stringify(wrongWords)
    );

  }


  // 今の単語を削除
  remainingWords.splice(
    currentWord,
    1
  );


  showNextWord();

}


// =========================
// 「間違えた」ボタン
// =========================

wrongButton.onclick = function() {

  if (remainingWords.length === 0) {
    return;
  }


  const item =
    remainingWords[currentWord];


  const alreadyExists =
    wrongWords.some(function(wrongItem) {

      return wrongItem[0] ===
        item[0];

    });


  if (!alreadyExists) {

    wrongWords.push([
      item[0],
      item[1],
      item[2]
    ]);


    localStorage.setItem(
      "wrongWords",
      JSON.stringify(wrongWords)
    );

  }


  answeredWrong = true;


  wrongButton.textContent =
    "記録済み";

};

    const div =

const isDifficult =

div.innerHTML =

  "</strong>" +

  "<span>" +
  item[1] +
  "</span>";

      difficultWords.some(function(word) {

    if (exists) {

      difficultWords =
        difficultWords.filter(function(word) {
          return word[0] !== item[0];
        });

    } else {

      difficultWords.push([
        item[0],

        index + 1

    }

    localStorage.setItem(
      "difficultWords",

    // 一覧を更新
    listButton.onclick();

    wordList.appendChild(div);

};

        return Math.random() - 0.5;

        Math.min(10, wrongWords.length)

    "none";

  continueRangeButton.style.display =
    "none";

  listScreen.style.display =
    "none";

  startScreen.style.display =
    "none";

  quizScreen.style.display =
    "block";

  showNextWord();

};

// =========================
// 範囲から10問
// =========================

tenButton.onclick = function() {

  const start = Number(
    document.getElementById("startNumber").value
  );

  const end = Number(
    document.getElementById("endNumber").value
  );


  // 範囲チェック
  if (
    start < 1 ||
    end > words.length ||
    start > end
  ) {

    alert(
      "1〜" + words.length +
      "の範囲で指定してください！"
    );

    return;
  }


  // 10個未満ならできない
  if (end - start + 1 < 10) {

    alert(
      "10問出題するには、10個以上の範囲を指定してください！"
    );

    return;
  }


  // 範囲を保存
  localStorage.setItem(
    "startNumber",
    start
  );

  localStorage.setItem(
    "endNumber",
    end
  );

  tenStart = start;
  tenEnd = end;
  localStorage.setItem(
  "tenStart",
  start
);

localStorage.setItem(
  "tenEnd",
  end
);

localStorage.setItem(
  "tenMode",
  "true"
);
  // =========================
  // 指定範囲を全部保存
  // =========================

  remainingRangeWords =
    words
      .map(function(item, index) {

        return [
          item[0],
          item[1],
          index + 1
        ];

      })
      .slice(start - 1, end);
localStorage.setItem(
  "remainingRangeWords",
  JSON.stringify(remainingRangeWords)
);

  tenMode = true;
  practicingWrongWords = false;
  answeredWrong = false;
  showingJapanese = false;
continueRangeButton.style.display = "none";

  // 最初の10問を作る
  makeNextTen();


  startScreen.style.display =
    "none";

  listScreen.style.display =
    "none";

  quizScreen.style.display =
    "block";


  showNextWord();

};


// =========================
// 次の10問を作る
// =========================

function makeNextTen() {

  // 残りが10個未満なら、
  // 残っている全部を出題
  const numberOfQuestions =
    Math.min(
      10,
      remainingRangeWords.length
    );


  // 残りの範囲からランダムに選ぶ
  remainingRangeWords.sort(
    function() {

      return Math.random() - 0.5;

    }
  );


  // 10個取り出す
  remainingWords =
    remainingRangeWords.splice(
      0,
      numberOfQuestions
    );
localStorage.setItem(
  "remainingRangeWords",
  JSON.stringify(remainingRangeWords)
);

  currentWord = 0;

  showingJapanese = false;
  answeredWrong = false;

}


// =========================
// 残りの単語から10問
// =========================

continueTenButton.onclick =
  function() {

    if (
      remainingRangeWords.length === 0
    ) {

      alert(
        "もう残りの単語はありません！"
      );

      return;
    }


    // 次の10問を作る
    makeNextTen();


    continueTenButton.style.display =
      "none";


    showNextWord();

  };
quizBackButton.onclick =
  function() {

    // 10問モードは終了させない
    // 進捗をそのまま残す
    quizBackButton.style.display =
      "none";

    continueTenButton.style.display =
      "none";

    quizScreen.style.display =
      "none";

    startScreen.style.display =
      "block";

  };
// =========================
// 続きから10問
// =========================

continueRangeButton.onclick =
  function() {

    if (
      !tenStart ||
      !tenEnd ||
      remainingRangeWords.length === 0
    ) {

      alert(
        "続きからできる10問がありません！"
      );

      return;
    }

    tenMode = true;
    practicingWrongWords = false;
    answeredWrong = false;

    makeNextTen();

    startScreen.style.display =
      "none";

    listScreen.style.display =
      "none";

    quizScreen.style.display =
      "block";

    showNextWord();

  };
