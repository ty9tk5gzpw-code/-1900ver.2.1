<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f4f7;
  min-height: 100vh;
}

.app {
  width: 100%;
  min-height: 100vh;
  background: white;
  padding: 50px 25px;
  text-align: center;
}

h1 {
  font-size: 32px;
  margin: 10px 0 40px;
}

p {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 10px;
}

input {
  width: 100%;
  padding: 18px;
  font-size: 22px;
  border: 2px solid #ccc;
  border-radius: 12px;
  margin-bottom: 20px;
  text-align: center;
}

button {
  width: 100%;
  padding: 20px;
  font-size: 22px;
  font-weight: bold;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  margin-bottom: 10px;
}

#word {
  min-height: 65vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  user-select: none;
}

#word div {
  font-size: 22px;
  margin-bottom: 25px;
}

#word h2 {
  font-size: 56px;
  margin: 0;
}
#wordList div {
  display: flex;
  align-items: center;
  font-size: 22px;
  min-height: 55px;
  border-bottom: 1px solid #ddd;
}

#wordList strong {
  width: 60px;
  text-align: center;
}

#wordList span:nth-of-type(1) {
  width: 180px;
  text-align: left;
  font-weight: bold;
}

#wordList span:nth-of-type(2) {
  flex: 1;
  text-align: left;
}

#wordList hr {
  display: none;
}


</style>
</head>

startButton.onclick = function() {

  const start = Number(
    document.getElementById("startNumber").value
  );

  const end = Number(
    document.getElementById("endNumber").value
  );

  if (
    start < 1 ||
    end > words.length ||
    start > end
  ) {

    alert(
      "1〜" + words.length +
      "の範囲で指定してください！"
    );

    return;
  }

  remainingWords = words
    .map(function(item, index) {

      return [
        item[0],
        item[1],
        index + 1
      ];

    })
    .slice(start - 1, end);


  startScreen.style.display = "none";
  quizScreen.style.display = "block";

  showNextWord();

};

function showNextWord() {
if (remainingWords.length === 0) {

  word.innerHTML =

  word.onclick = function() {

        item[0] +

        item[1] +
        "<hr>";

      wordList.appendChild(div);

    });

  };

  return;
}

  showingJapanese = false;
answeredWrong = false;
  wrongButton.style.display = "none";
  wrongButton.textContent = "間違えた";

}


word.onclick = function() {

};

</script>
